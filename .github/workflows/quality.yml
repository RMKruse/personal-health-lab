name: Quality

on:
  pull_request:
    branches: [main]

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only dev to main
        run: test "$GITHUB_HEAD_REF" = dev

  linux:
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Unchanged V0.2 release gate
        run: uv run pytest tests/acceptance/test_v02_release_gate.py tests/acceptance/test_v02_write_plan.py::test_v02_matrix_is_well_formed_and_fully_registered
      - name: V0.3 delta matrix
        run: uv run pytest tests/acceptance/test_v03_matrix.py tests/acceptance/test_v03_release_gate.py
      - name: Full test suite
        run: uv run pytest

  macos:
    needs: validate-source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Real and controlled probe conformance
        run: uv run pytest tests/platform/test_macos_probes.py

  acceptance-evidence:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Generate pinned acceptance evidence
        env:
          V03_LINUX_GATE_STATUS: ${{ needs.linux.result }}
          V03_MACOS_GATE_STATUS: ${{ needs.macos.result }}
        run: uv run python scripts/v03_acceptance_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: v03-acceptance-evidence.json
