name: Quality

on:
  pull_request:
    branches: [main]

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only dev to main
        run: test "$GITHUB_HEAD_REF" = dev

  linux:
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  macos:
    needs: validate-source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Real and controlled probe conformance
        run: |
          uv run pytest \
            tests/platform/test_macos_probes.py \
            tests/acceptance/test_v02_store_preflight.py

  acceptance-evidence:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pinned V0.2 evidence
        run: python scripts/v02_acceptance_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: v02-acceptance-evidence
          path: v02-acceptance-evidence.json
