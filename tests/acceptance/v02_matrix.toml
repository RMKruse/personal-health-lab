schema_version = 1
release = "v0.2"

[[contract]]
id = "V02-C-API-002"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Every write uses a side-effect-free preview and explicit execution."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-API-003"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "The plan fingerprint binds all decision-relevant facts and is not persisted."
evidence = ["positive", "negative"]

[[contract]]
id = "V02-C-API-004"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Plans, receipts, and expected outcomes are closed typed values."
evidence = ["positive", "negative", "fault"]

[[contract]]
id = "V02-C-PRE-001"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Every store has a stable non-personal ID and immutable data-mode binding."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-PRE-002"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Real imports require one-person confirmation and bind only decided personal data."
evidence = ["positive", "negative", "fault"]

[[contract]]
id = "V02-C-PRE-003"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "FileVault has four typed findings and synthetic stores are never probed."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-PRE-004"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Actual write targets are rechecked and only a protected improvement may continue."
evidence = ["positive", "negative", "transition"]

