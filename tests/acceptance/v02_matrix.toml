[[contract]]
id = "V02-C-PRE-002"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Real imports require one-person confirmation and bind only decided personal data."
evidence = ["positive", "negative", "fault"]

[[contract]]
id = "V02-C-PRE-003"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "FileVault has four typed findings and synthetic stores are never probed."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-PRE-004"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Actual write targets are rechecked and only a protected improvement may continue."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-PRE-005"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Capacity uses the hard estimate, margin, and minimum-rest formula per target volume."
evidence = ["positive", "negative", "boundary"]

[[contract]]
id = "V02-C-PRE-006"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Operation estimates bound additional simultaneously live allocation."
evidence = ["positive", "stress"]

[[contract]]
id = "V02-C-PRE-007"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Every writer and scratch bound is conservative and versioned."
evidence = ["positive", "negative", "boundary"]

[[contract]]
id = "V02-C-PRE-008"
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
statement = "Allocation evidence, statvfs, and atomic runtime failures remain separate checks."
evidence = ["positive", "negative", "fault"]

