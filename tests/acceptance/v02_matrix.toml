[[contract]]
id = "V02-C-RST-001"
statement = "Metadata restore starts only from a valid backup into a new empty real store and creates one durable restore-pending session."
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-RST-002"
statement = "A restore-pending store exposes only recovery status, required source import, and abort while domain reads and unrelated writes remain blocked."
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-RST-003"
statement = "Restore source imports match exact logical and version identities plus content fingerprints and remain pending until every required reference exists."
source = "https://github.com/RMKruse/personal-health-lab/issues/54"
evidence = ["positive", "negative", "boundary", "transition"]

[[contract]]
id = "V02-C-RST-004"
statement = "Supported backup schemas migrate forward in an isolated working copy and never mutate the original backup."
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V02-C-RST-005"
statement = "The closing source import atomically activates the restored metadata overlay, audit history, person binding, and exactly one snapshot without reviving tombstoned state."
source = "https://github.com/RMKruse/personal-health-lab/issues/54"
evidence = ["positive", "negative", "fault", "transition"]

[[contract]]
id = "V02-C-RST-006"
statement = "Aborting a pending restore discards the newly created store completely; an already represented backup is idempotent."
source = "https://github.com/RMKruse/personal-health-lab/issues/33"
evidence = ["positive", "negative", "transition"]

