[[contract]]
id = "V04-C-ANALYSIS-CATALOG-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/112"
statement = "HealthLab projects exactly four immutable versioned analysis definitions with fixed result families, horizons, and method facts without requiring a dataset snapshot."

[[contract]]
id = "V04-C-MATRIX-VALIDATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/112"
statement = "The growing V0.4 delta matrix rejects open definition IDs, case IDs, runners, and hash references."

[[contract]]
id = "V04-C-SNAPSHOT-SELECTION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "Snapshot catalog selection resolves active references dynamically, keeps explicit historical references pinned, and returns closed reasons for unavailable selections."

[[contract]]
id = "V04-C-HISTORICAL-WRITE-LOCK-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "Every write preview is blocked in historical reproduction mode without changing the active snapshot and unlocks when active selection is restored."

[[contract]]
id = "V04-C-V03-COMPATIBILITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "The delivered V0.4 snapshot selection slice preserves the existing V0.3 application behavior."

[[contract]]
id = "V04-C-RUN-ANALYSIS-PLAN-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "RunAnalysis accepts only a fixed definition, optional inclusive date bounds, and input schema 1.0; its preview binds the active snapshot, requested and eligible periods, approval, and an optional reuse candidate."

[[contract]]
id = "V04-C-RUN-ANALYSIS-RECHECK-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "RunAnalysis rechecks request-bound plan facts and the fingerprint under the shared writer lock; plan_changed, store_busy, and blocked never create a model run."

[[contract]]
id = "V04-C-RUN-ANALYSIS-LEGACY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "The old resting-heart-rate request remains executable only as JSON 3.0 adapter compatibility and is absent from the canonical V0.4 WriteRequest union."

[[contract]]
id = "V04-C-RUN-ANALYSIS-START-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "Each started RunAnalysis attempt receives a new AnalysisRunId while non-started paths create no run."

[[contract]]
id = "V04-C-ANALYSIS-INPUT-BUNDLE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "A started attempt freezes its calendar, values, missingness, rule versions, source evidence, data-quality facts, and scalings; insufficient_data persists no result identity or statistical result."

[[contract]]
id = "V04-C-ANALYSIS-RUN-ATOMICITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "Analysis input and technical outcome become visible together; injected faults expose no partial run after reopen and V0.3 remains readable."

[[contract]]
id = "V04-C-ANALYSIS-ARTIFACT-SCHEMAS-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "Input bundles and all four result families use separate closed JSONL schema version 1 manifests while SQLite stores only identities, hashes, sizes, and internal locations."

[[contract]]
id = "V04-C-ANALYSIS-PUBLICATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "AnalysisRunPublication validates and publishes input, optional result, run, receipt, and artifact catalog atomically under the shared writer lock."

[[contract]]
id = "V04-C-ANALYSIS-LEGACY-MIGRATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "The store upgrade idempotently registers untouched V0.1-V0.3 result artifacts as legacy and never reinterprets their definitions as V0.4 definitions."

