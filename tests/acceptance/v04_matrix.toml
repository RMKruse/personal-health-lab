[[contract]]
id = "V04-C-ANALYSIS-CATALOG-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/112"
statement = "HealthLab projects exactly four immutable versioned analysis definitions with fixed result families, horizons, and method facts without requiring a dataset snapshot."

[[contract]]
id = "V04-C-MATRIX-VALIDATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/112"
statement = "The growing V0.4 delta matrix rejects open definition IDs, case IDs, runners, and hash references."

[[contract]]
id = "V04-C-SNAPSHOT-SELECTION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "Snapshot catalog selection resolves active references dynamically, keeps explicit historical references pinned, and returns closed reasons for unavailable selections."

[[contract]]
id = "V04-C-HISTORICAL-WRITE-LOCK-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "Every write preview is blocked in historical reproduction mode without changing the active snapshot and unlocks when active selection is restored."

[[contract]]
id = "V04-C-V03-COMPATIBILITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/113"
statement = "The delivered V0.4 snapshot selection slice preserves the existing V0.3 application behavior."

[[contract]]
id = "V04-C-RUN-ANALYSIS-PLAN-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "RunAnalysis accepts only a fixed definition, optional inclusive date bounds, and input schema 1.0; its preview binds the active snapshot, requested and eligible periods, approval, and an optional reuse candidate."

[[contract]]
id = "V04-C-RUN-ANALYSIS-RECHECK-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "RunAnalysis rechecks request-bound plan facts and the fingerprint under the shared writer lock; plan_changed, store_busy, and blocked never create a model run."

[[contract]]
id = "V04-C-RUN-ANALYSIS-LEGACY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/114"
statement = "The old resting-heart-rate request remains executable only as JSON 3.0 adapter compatibility and is absent from the canonical V0.4 WriteRequest union."

[[contract]]
id = "V04-C-RUN-ANALYSIS-START-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "Each started RunAnalysis attempt receives a new AnalysisRunId while non-started paths create no run."

[[contract]]
id = "V04-C-ANALYSIS-INPUT-BUNDLE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "A started attempt freezes its calendar, values, missingness, rule versions, source evidence, data-quality facts, and scalings; insufficient_data persists no result identity or statistical result."

[[contract]]
id = "V04-C-ANALYSIS-RUN-ATOMICITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/115"
statement = "Analysis input and technical outcome become visible together; injected faults expose no partial run after reopen and V0.3 remains readable."

[[contract]]
id = "V04-C-ANALYSIS-ARTIFACT-SCHEMAS-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "Input bundles and all four result families use separate closed JSONL schema version 1 manifests while SQLite stores only identities, hashes, sizes, and internal locations."

[[contract]]
id = "V04-C-ANALYSIS-PUBLICATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "AnalysisRunPublication validates and publishes input, optional result, run, receipt, and artifact catalog atomically under the shared writer lock."

[[contract]]
id = "V04-C-ANALYSIS-LEGACY-MIGRATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/116"
statement = "The store upgrade idempotently registers untouched V0.1-V0.3 result artifacts as legacy and never reinterprets their definitions as V0.4 definitions."

[[contract]]
id = "V04-C-ANALYSIS-RUN-HISTORY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/117"
statement = "Analysis run history resolves one snapshot and definition, includes every started attempt with its technical outcome, and exposes the resolved snapshot, definition, period, and run references."

[[contract]]
id = "V04-C-ANALYSIS-RESULT-SELECTION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/117"
statement = "Analysis result selection resolves an explicit matching run or the latest started run for the snapshot and definition, including insufficient_data and unstable attempts without falling back."

[[contract]]
id = "V04-C-ANALYSIS-RESULT-UNAVAILABLE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/117"
statement = "Missing snapshots, runs, results, artifacts, selection mismatches, and integrity failures return the closed ProjectionUnavailable code instead of a technical exception or older result."

[[contract]]
id = "V04-C-ANALYSIS-PROJECTION-COMPATIBILITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/117"
statement = "The two focused V0.4 analysis projections extend the exact public HealthLab surface while preserving every delivered V0.3 operation."

[[contract]]
id = "V04-C-ANALYSIS-REUSE-IDENTITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/121"
statement = "Only a completed run with identical definition, canonical configuration and period, snapshot, frozen input content, code state, and environment lock is reusable; reuse creates only a new receipt for the existing run and result identities."

[[contract]]
id = "V04-C-ANALYSIS-INTEGRITY-REPRODUCIBILITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/121"
statement = "Reuse and current reproducibility require available artifacts with known schemas and valid catalog, manifest, file-size, and SHA-256 facts; missing material and every integrity failure expose closed unavailability without partial values."

[[contract]]
id = "V04-C-ANALYSIS-STATUS-AXES-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/121"
statement = "Technical run status, frozen data status, frozen model maturity, dynamically derived freshness, and dynamically derived reproducibility remain separate traceable axes."

[[contract]]
id = "V04-C-SHORT-LAG-ACTIVITY-DESIGN-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/118"
statement = "The short lag model jointly uses the four general activity inputs and duration and energy for every analytical workout type, pooling types with fewer than ten positive days into Other without adding redundant totals, interactions, scores, or data-dependent feature selection."

[[contract]]
id = "V04-C-SHORT-LAG-POINT-FIT-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/118"
statement = "The short lag model uses the calibrated seven-node lag basis, smoothing penalty 3, and ridge penalty 1 and publishes daily and cumulative day 1-7 point estimates in personal-SD and fixed natural units."

[[contract]]
id = "V04-C-SHORT-LAG-TECHNICAL-OUTCOMES-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/118"
statement = "Zero or non-finite activity scaling, rank loss, and non-finite point estimates produce a closed insufficient_data or unstable run without a result identity or partial artifact."

[[contract]]
id = "V04-C-SHORT-LAG-CONTEXT-SENSITIVITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/119"
statement = "The short lag primary fit uses explicit outcome-day sleep, illness, stress-origin, and medication context; mandatory context-days-0-2 and no-context fits use fixed complete-case rules and expose rows, missingness, variants, and scalings."

[[contract]]
id = "V04-C-ANALYSIS-INPUT-SCHEMA2-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/119"
statement = "New analysis input bundles use closed schema version 2 so typed measurement, manual-context, and medication revision source records can be frozen without conflating opaque identifier kinds; legacy version 1 artifacts remain cataloged."

[[contract]]
id = "V04-C-SHORT-LAG-BOOTSTRAP-UNCERTAINTY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/120"
statement = "The short lag result uses primary and factor-2 moving-block full-refit runs with 2,000 successes in at most 2,020 attempts, pointwise intervals, the calibrated studentized simultaneous band, and recomputed cumulative contrasts; underfulfillment is unstable."

[[contract]]
id = "V04-C-SHORT-LAG-MATURITY-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/120"
statement = "Every calibrated short lag maturity criterion exposes its code, observed value, threshold, and verdict, and the complete criterion family determines exploratory or robust maturity."

[[contract]]
id = "V04-C-SHORT-LAG-SYNTHETIC-CASES-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/120"
statement = "The V0.4 delta registers short lag signal, null, missingness, maturity-boundary, and bootstrap-failure cases without personal health values."

[[contract]]
id = "V04-C-LONG-LAG-INDEPENDENCE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/122"
statement = "The long lag definition starts and fits independently of the short lag definition and owns separate run, result, technical status, reuse, selection, and model maturity facts for the same snapshot."

[[contract]]
id = "V04-C-LONG-LAG-PROFILE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/122"
statement = "The long lag model uses the calibrated 30-day nine-node basis, smoothing penalty 300, and ridge penalty 1 and publishes daily estimates plus day 1-7, 8-30, and 1-30 contrasts per feature in personal-SD and fixed natural units."

