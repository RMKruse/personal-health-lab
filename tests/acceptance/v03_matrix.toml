[[contract]]
id = "V03-C-CONTEXT-COVERAGE-START-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/77"
statement = "A coverage-start revision binds its normalized input, active snapshot, local context day, immutable revision, audit event, and new snapshot; days before it stay unknown while later gaps use only the two context baselines."
evidence = ["positive", "negative", "transition"]

[[contract]]
id = "V03-C-MEDICATION-REGIME-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/80"
statement = "A medication regime is an immutable, snapshot-bound local IANA timeline with validated scheduled doses; DST gaps move forward, folds use the first occurrence, and a missing deviation is assumed as planned."
evidence = ["positive", "boundary", "transition"]

[[contract]]
id = "V03-C-MEDICATION-DEVIATION-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/81"
statement = "One immutable deviation binds one scheduled occurrence; omitted, changed-time or changed-dose, and multiple actual intakes share one model, while identical intake is no_change and invalidating regime corrections are blocked."
evidence = ["positive", "negative", "transition", "boundary"]

[[contract]]
id = "V03-C-AS-NEEDED-INTAKE-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/82"
statement = "A snapshot-bound as-needed intake references the valid PRN entry at its actual instant, has a positive dose in that entry's unit, and may use one active globally normalized reason category; category revisions preserve old snapshot displays and active regime preferences block withdrawal."
evidence = ["positive", "negative", "transition", "boundary"]

[[contract]]
id = "V03-C-DAILY-STRESS-CUSTOM-CONTEXT-V1"
source = "https://github.com/RMKruse/personal-health-lab/issues/79"
statement = "One daily stress revision is active per local day, an observed average remains distinct from the baseline assumption, and normalized custom labels reserve their names while same-label periods cannot overlap."
evidence = ["positive", "negative", "transition"]

