[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-health-lab"
version = "0.1.0"
description = "Privacy-first analysis of longitudinal personal health data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "duckdb>=1.4",
    "jsonschema>=4.26",
    "numpy>=2.3",
    "streamlit>=1.47",
]

[project.scripts]
healthlab = "personal_health_lab.adapters.cli:main"
healthlab-dev = "personal_health_lab.adapters.dev_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_health_lab"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["personal_health_lab"]
